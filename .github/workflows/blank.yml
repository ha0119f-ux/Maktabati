
name: Build Maktabati Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepare Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Find and extract project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip"
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one project ZIP."
            echo "Found: ${#ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Extracting: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully."

      # 4. Locate Gradle project
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find extracted \
            -type f -name gradlew -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLE_FILE"

          echo "Gradle project: $PROJECT_DIR"

      # 5. Build APK
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 6. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          echo "APK found: $APK_FILE"

          unzip -t "$APK_FILE"

          mkdir -p output

          cp "$APK_FILE" output/app-debug.apk

          ls -lh output/app-debug.apk

      # 7. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktabati-Android-APK
          path: output/app-debug.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          
