
name: Build Maktabati Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found in repository root."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Gradle wrapper
        run: |
          GRADLE_FILE=$(find extracted -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLE_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

                - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktabati-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
